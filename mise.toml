[tools]
bun = "1.3.14"

[env]
# Isolate this project's JetStream events from other local Coleo instances.
# Keep COLEO_NATS_URL unset so `coleo serve` automatically starts this project-local NATS server.
COLEO_NATS_PORT = "4223"
COLEO_NATS_HTTP_PORT = "8223"

[tasks.dev]
run = "bun run dev"

[tasks.brain]
run = "bun run brain"

[tasks.server]
run = "bun run server"

[tasks.agent]
description = "Run the local Arm Host in the foreground"
run = "bun run agent"

[tasks.setup]
description = "Install server dependencies; clients are opt-in"
run = "bun run setup"

[tasks."setup:cli"]
description = "Install the optional Python API client (no TUI)"
tools = { uv = "0.11.8" }
run = "uv tool install --force --python 3.12 ."

[tasks."setup:tui"]
description = "Install the Python API client with the optional terminal workspace"
tools = { uv = "0.11.8" }
run = "uv tool install --force --python 3.12 '.[tui]'"

[tasks."setup:web"]
description = "Install the optional sibling web client's dependencies"
run = "bun run setup:web"

[tasks."setup:all"]
description = "Install all development dependencies for server and clients"
tools = { uv = "0.11.8", python = "3.12.14" }
run = ["bun run setup:all", "uv sync --locked --extra tui"]

[tasks.build]
run = "bun run build"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.shellcheck]
tools = { shellcheck = "latest" }
run = "shellcheck bin/*.sh"

[tasks.check]
run = "mise run shellcheck && mise run typecheck"

[tasks.test]
run = "bun run test"

[tasks."test:installer"]
description = "Verify component bootstrap, manifests, and transactional installation"
tools = { go = "1.25.9" }
run = "bun run test:installer"

[tasks."test:watch"]
run = "bun run test:watch"

[tasks."test:integration"]
run = "bun run test:integration"

[tasks."test:e2e"]
run = "bun run test:e2e"

[tasks."test:distributed-observability"]
run = "bun run test:distributed-observability"

[tasks."index:transcripts"]
run = "bun run index:transcripts"

[tasks."simulate:arm-output"]
run = "bun run simulate:arm-output"

[tasks."web:dev"]
run = "bun run web:dev"

[tasks."web:build"]
run = "bun run web:build"

[tasks."web:preview"]
run = "bun run web:preview"

[tasks."docs:dev"]
run = "bun run docs:dev"

[tasks."docs:build"]
run = "bun run docs:build"

[tasks."docs:preview"]
run = "bun run docs:preview"

[tasks."docs:deploy:cloudflare"]
run = "bun run docs:deploy:cloudflare"

[tasks."client:sync"]
tools = { uv = "0.11.8", python = "3.12.14" }
run = "uv sync --locked"

[tasks."client:test"]
tools = { uv = "0.11.8", python = "3.12.14" }
run = "uv run --locked --group dev pytest clients/python/tests -q"

[tasks."client:integration"]
tools = { uv = "0.11.8", python = "3.12.14" }
run = "uv run --locked --group dev python clients/python/run-integration.py"

[tasks."client:cli"]
tools = { uv = "0.11.8", python = "3.12.14" }
run = "uv run --locked --no-dev coleo-client"

[tasks."client:tui"]
tools = { uv = "0.11.8", python = "3.12.14" }
raw = true
run = "uv run --locked --no-dev --extra tui coleo-client tui"

[tasks."client:mac:build"]
run = "swift build --package-path clients/macos"

[tasks."client:mac:test"]
run = "swift test --package-path clients/macos"

[tasks."client:mac:run"]
run = "swift run --package-path clients/macos ColeoInboxMac"

[tasks."client:mac:app"]
run = "bash clients/macos/scripts/make-app.sh"

[tasks."dev:core"]
run = "bun run dev:core"

[tasks."dev:all"]
run = "bun run dev:all"

[tasks."dev:core:restart"]
run = "bun run dev:core:restart"

[tasks."dev:core:stop"]
run = "bun run dev:core:stop"
