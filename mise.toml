[tools]
bun = "latest"
python = "3.12.14"
uv = "latest"
shellcheck = "latest"

[env]
# Isolate this project's JetStream events from other local Coleo instances.
# Keep COLEO_NATS_URL unset so `coleo serve` automatically starts this project-local NATS server.
COLEO_NATS_PORT = "4223"
COLEO_NATS_HTTP_PORT = "8223"

[tasks.dev]
run = "bun run dev"

[tasks.brain]
run = "bun run brain"

[tasks.server]
run = "bun run server"

[tasks.setup]
run = "bun run setup && uv sync --locked"

[tasks.build]
run = "bun run build"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.shellcheck]
run = "shellcheck bin/*.sh"

[tasks.check]
run = "mise run shellcheck && mise run typecheck"

[tasks.test]
run = "bun run test"

[tasks."test:watch"]
run = "bun run test:watch"

[tasks."test:integration"]
run = "bun run test:integration"

[tasks."test:e2e"]
run = "bun run test:e2e"

[tasks."test:distributed-observability"]
run = "bun run test:distributed-observability"

[tasks."index:transcripts"]
run = "bun run index:transcripts"

[tasks."simulate:arm-output"]
run = "bun run simulate:arm-output"

[tasks."web:dev"]
run = "bun run web:dev"

[tasks."web:build"]
run = "bun run web:build"

[tasks."web:preview"]
run = "bun run web:preview"

[tasks."docs:dev"]
run = "bun run docs:dev"

[tasks."docs:build"]
run = "bun run docs:build"

[tasks."docs:preview"]
run = "bun run docs:preview"

[tasks."docs:deploy:cloudflare"]
run = "bun run docs:deploy:cloudflare"

[tasks."client:sync"]
run = "uv sync --locked"

[tasks."client:test"]
run = "uv run --locked --group dev pytest clients/python/tests -q"

[tasks."client:integration"]
run = "uv run --locked --group dev python clients/python/run-integration.py"

[tasks."client:cli"]
run = "uv run --locked coleo-inbox"

[tasks."client:tui"]
run = "uv run --locked coleo-inbox tui"

[tasks."dev:core"]
run = "bun run dev:core"

[tasks."dev:all"]
run = "bun run dev:all"

[tasks."dev:core:restart"]
run = "bun run dev:core:restart"

[tasks."dev:core:stop"]
run = "bun run dev:core:stop"
