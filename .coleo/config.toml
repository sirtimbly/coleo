# Coleo Configuration
# Updated: 2026-07-29T19:45:25.028Z

version = 1

[brain]
poll_interval_ms = 30000
max_arms = 8
arm_grace_period_minutes = 2
provider = "openai"
model = "gpt-5.6-luna"

[refactoring]
file_size_threshold = 400
enabled = true

[automations]
enabled = true

[automations.refactor_large_files]
enabled = true
min_interval_hours = 24
require_empty_queue = true

[maintenance]
enabled = true
task_prefix = "Maintenance"
tasks = []

[mail]
provider = "cloudflare"
from_address = "brain@coleo.local"
to_address = ""
digest_schedule = "immediate"

[terminal]
emulator = "auto"

[docs]
update_file_threshold = 10
update_poll_interval = 10
update_enabled = true

[defaults]
harness = "opencode"
provider = "openai"
model = "gpt-5.3-codex-spark"
context_budget = 240000

[compression]
warning_threshold = 80
critical_threshold = 95
max_threshold = 100
enabled = true
