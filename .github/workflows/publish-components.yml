name: Publish component assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (coleo-vX.Y.Z)
        required: true
        type: string
      publish:
        description: Attach tested artifacts to the existing GitHub release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      COLEO_RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COLEO_RELEASE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.8
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.9
          cache: false
      - run: bun run setup
      - name: Bootstrap and manifest fixtures
        run: bun test bin/__tests__/installer-bootstrap.test.ts server/src/scripts/__tests__/build-release-manifest.test.ts
      - name: Installer fixtures
        working-directory: packaging/installer
        run: go test ./...
      - name: Build standalone installer
        working-directory: packaging/installer
        env:
          CGO_ENABLED: '0'
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p ../../release-assets
          go build -trimpath -ldflags='-s -w' -o "../../release-assets/coleo-installer-$PLATFORM" .
      - name: Build release packages and locked wheelhouse
        run: bun run server/src/scripts/package-components.ts platform release-assets
      - name: Validate manifest and installed artifacts
        run: |
          bun run server/src/scripts/build-release-manifest.ts --assets release-assets --version "$COLEO_RELEASE_VERSION" --commit "$(git rev-parse HEAD)"
          bun run server/src/scripts/smoke-component-artifacts.ts release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: components-${{ matrix.platform }}
          path: |
            release-assets/*
            !release-assets/coleo-release.json
            !release-assets/SHA256SUMS

  web:
    runs-on: ubuntu-24.04
    env:
      COLEO_RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COLEO_RELEASE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.8
      - run: bun run setup
      - run: bun run server/src/scripts/package-components.ts web release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: components-web
          path: release-assets/*

  macos:
    # Enable only after maintainer configures Apple credentials.
    if: vars.COLEO_MACOS_RELEASE_ENABLED == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      COLEO_RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      COLEO_RELEASE_ARCH: ${{ matrix.arch }}
      COLEO_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      COLEO_NOTARY_PROFILE: coleo-release
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COLEO_RELEASE_VERSION }}
      - name: Configure ephemeral signing keychain
        shell: bash
        run: |
          set -euo pipefail
          : "${COLEO_SIGNING_IDENTITY:?Missing signing identity}"
          : "${APPLE_CERTIFICATE_BASE64:?Missing Developer ID certificate}"
          KEYCHAIN="$RUNNER_TEMP/coleo-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/coleo-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/coleo-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN"
          xcrun notarytool store-credentials "$COLEO_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Sign, notarize, staple, and package application
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${COLEO_RELEASE_VERSION#coleo-}"
          VERSION="${VERSION#v}"
          export COLEO_VERSION="$VERSION"
          bash clients/macos/scripts/make-app.sh
          FILE="coleo-macos-$VERSION-darwin-$COLEO_RELEASE_ARCH.zip"
          mkdir -p release-assets
          bash clients/macos/scripts/package-release.sh clients/macos/.build/ColeoInbox.app "release-assets/$FILE"
          cat > "release-assets/macos-$COLEO_RELEASE_ARCH.component.json" <<EOF
          {"macos":{"version":"$VERSION","signed":true,"notarized":true,"compatibility":{"testedServer":"$VERSION","requiredCapabilities":[]},"artifacts":{"darwin-$COLEO_RELEASE_ARCH":{"file":"$FILE","format":"zip"}}}}
          EOF
      - name: Remove ephemeral signing credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          security delete-keychain "$RUNNER_TEMP/coleo-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/coleo-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: components-macos-${{ matrix.arch }}
          path: release-assets/*

  assemble:
    needs: [platform, web, macos]
    if: >-
      always() && needs.platform.result == 'success' && needs.web.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      COLEO_RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COLEO_RELEASE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/download-artifact@v4
        with:
          pattern: components-*
          path: release-assets
          merge-multiple: true
      - name: Build immutable manifest and checksums
        run: |
          cp bin/install.sh bin/uninstall.sh release-assets/
          bun test server/src/scripts/__tests__/build-release-manifest.test.ts
          bun run server/src/scripts/build-release-manifest.ts --assets release-assets --version "$COLEO_RELEASE_VERSION" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: coleo-release
          path: release-assets/*
      - name: Attach assets (never overwrite a published artifact)
        if: github.event_name == 'release' || inputs.publish
        run: gh release upload "$COLEO_RELEASE_VERSION" release-assets/*
