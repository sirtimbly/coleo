name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Verify Bun lockfile policy
        run: test "$(git ls-files '*package-lock.json' '*bun.lock' '*bun.lockb')" = "bun.lock"
      - name: Install dependencies
        run: bun run setup
      - name: Run tests
        run: bun run test
      - name: Run typecheck
        run: bun run typecheck
      - name: Lint web UI
        run: bun run --cwd src/web lint
      - name: Build web UI
        run: bun run web:build
      - name: Build docs
        run: bun run docs:build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun run setup
      - name: Install opencode harness
        run: bun install -g opencode-ai
      - name: Smoke test opencode serve
        run: |
          opencode serve --port 19399 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19399/global/health; then break; fi
            sleep 1
          done
          curl -s http://127.0.0.1:19399/global/health || echo "health check failed"
          kill $SERVER_PID || true
      - name: Run integration regression suite
        run: bun run test:integration
      - name: Dump agent logs on failure
        if: failure()
        run: |
          for log in /tmp/coleo-regression-*/.coleo/run/agent-autostart.log; do
            echo "=== $log ==="
            tail -100 "$log" || true
          done
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: .coleo/regression-results/
          if-no-files-found: ignore

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun run setup
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bun run test:e2e:web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
