name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Verify Bun lockfile policy
        run: test "$(git ls-files '*package-lock.json' '*bun.lock' '*bun.lockb')" = "bun.lock"
      - name: Install dependencies
        run: bun run setup
      - name: Run tests
        run: bun run test
      - name: Run typecheck
        run: bun run typecheck
      - name: Lint web UI
        run: bun run --cwd src/web lint
      - name: Build web UI
        run: bun run web:build
      - name: Build docs
        run: bun run docs:build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun run setup
      - name: Run server API smoke scenario
        run: bun run src/regression/runner.ts --scenario infrastructure-startup
      - name: Dump agent logs on failure
        if: failure()
        run: |
          for log in /tmp/coleo-regression-*/.coleo/run/agent-autostart.log; do
            echo "=== $log ==="
            tail -100 "$log" || true
          done
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: .coleo/regression-results/
          if-no-files-found: ignore

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun run setup
      - name: Build web UI
        run: bun run web:build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bun run test:e2e:web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
