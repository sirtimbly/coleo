name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Verify Bun lockfile policy
        run: test "$(git ls-files '*package-lock.json' '*bun.lock' '*bun.lockb')" = "bun.lock"
      - name: Install dependencies
        run: bun run setup
      - name: Run tests
        run: bun run test
      - name: Run typecheck
        run: bun run typecheck
      - name: Lint web UI
        run: bun run --cwd src/web lint
      - name: Build web UI
        run: bun run web:build
      - name: Build docs
        run: bun run docs:build
