name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify pull request changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import os
          import subprocess

          # Inspect the whole PR, including both sides of a rename. NUL delimiters
          # preserve spaces/newlines in filenames. Unknown paths require full CI.
          changed = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z",
              f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}",
          ]).decode("utf-8", errors="surrogateescape").split("\0")
          paths = [path for path in changed if path]
          root_docs = {"README.md", "AGENTS.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE.md"}
          docs_only = bool(paths) and all(
              path.startswith("docs/")
              or path in root_docs
              or (path.startswith("src/") and path.endswith("/README.md"))
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"application={str(not docs_only).lower()}\n")
          print(f"{len(paths)} changed paths; documentation only: {docs_only}")

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun run setup
      - name: Build docs
        run: bun run docs:build

  test:
    needs: changes
    # Run on master and if classification fails; skip only confirmed docs-only PRs.
    if: ${{ !cancelled() && needs.changes.outputs.application != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Verify Bun lockfile policy
        run: test "$(git ls-files '*package-lock.json' '*bun.lock' '*bun.lockb')" = "bun.lock"
      - name: Verify component versions
        run: bun run versions:check
      - name: Install dependencies
        run: bun run setup
      - name: Run tests
        run: bun run test
      - name: Run typecheck
        run: bun run typecheck
      - name: Lint web UI
        run: bun run --cwd src/web lint
      - name: Build web UI
        run: bun run web:build

  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.application != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun run setup
      - name: Run server API smoke scenario
        run: bun run src/regression/runner.ts --scenario infrastructure-startup
      - name: Dump agent logs on failure
        if: failure()
        run: |
          for log in /tmp/coleo-regression-*/.coleo/run/agent-autostart.log; do
            echo "=== $log ==="
            tail -100 "$log" || true
          done
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: .coleo/regression-results/
          if-no-files-found: ignore

  e2e-web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.application != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun run setup
      - name: Build web UI
        run: bun run web:build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: bun run test:e2e:web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
