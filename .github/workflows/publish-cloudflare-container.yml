name: Publish Cloudflare container

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cloudflare-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Build tenant image
        run: docker build --platform linux/amd64 --file Dockerfile.cloudflare --tag coleo-tenant:${GITHUB_SHA} .

      - name: Push immutable image
        run: bunx wrangler@4.110.0 containers push coleo-tenant:${GITHUB_SHA}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push latest image
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag coleo-tenant:${GITHUB_SHA} coleo-tenant:latest
          bunx wrangler@4.110.0 containers push coleo-tenant:latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
