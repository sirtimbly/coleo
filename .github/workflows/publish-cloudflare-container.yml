name: Publish Cloudflare container

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cloudflare-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install runtime dependencies
        run: bun install --frozen-lockfile --production

      - name: Resolve Arm Host image tag
        id: arm-image
        run: |
          tag=$(bun run src/scripts/cloudflare-agent-image-tag.ts)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if bunx wrangler@4.110.0 containers images list --json \
            | jq -e --arg tag "$tag" '.[] | select(.name == "coleo-agent") | .tags | index($tag)' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Arm Host image tag: ${tag}" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build control image
        run: docker build --platform linux/amd64 --file Dockerfile.cloudflare-control --tag coleo-control:${GITHUB_SHA} .

      - name: Build Arm Host image
        if: steps.arm-image.outputs.exists != 'true'
        run: docker build --platform linux/amd64 --file Dockerfile.cloudflare-agent --tag coleo-agent:${{ steps.arm-image.outputs.tag }} .

      - name: Push immutable control image
        run: bunx wrangler@4.110.0 containers push coleo-control:${GITHUB_SHA}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push immutable Arm Host image
        if: steps.arm-image.outputs.exists != 'true'
        run: bunx wrangler@4.110.0 containers push coleo-agent:${{ steps.arm-image.outputs.tag }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push latest control image
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag coleo-control:${GITHUB_SHA} coleo-control:latest
          bunx wrangler@4.110.0 containers push coleo-control:latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push latest Arm Host image
        if: github.ref == 'refs/heads/master' && steps.arm-image.outputs.exists != 'true'
        run: |
          docker tag coleo-agent:${{ steps.arm-image.outputs.tag }} coleo-agent:latest
          bunx wrangler@4.110.0 containers push coleo-agent:latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
