<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc">
<title id="title">Four clients. One project control plane.</title><desc id="desc">Four independently usable clients connect through HTTP to the Coleo API. Live clients also use authenticated WebSockets. The browser uses a separate web host proxy. Brain uses the API; API connects storage and NATS/JetStream; Arm Hosts manage harnesses and project workspaces.</desc>
