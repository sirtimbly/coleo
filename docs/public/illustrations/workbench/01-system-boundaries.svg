<text x="56" y="1030" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526970" text-anchor="start">Clients do not read SQLite, Maildir or JetStream.</text>
<text x="56" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526970" text-anchor="start">Brain reaches transport-backed state through the API.</text>
