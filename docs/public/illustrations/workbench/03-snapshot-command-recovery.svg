<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F7F5EF"/>
<text x="56" y="47" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#176E69" text-anchor="start" letter-spacing="2">COLEO  /  WORKBENCH FIELD GUIDE</text>
<text x="1384" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#526970" text-anchor="end">03 / 05</text>
<text x="56" y="104" font-family="Athelas, Georgia, serif" font-size="42" font-weight="400" fill="#132F39" text-anchor="start">Read a snapshot. Act on exact IDs. Recover.</text>
<text x="56" y="143" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526970" text-anchor="start">The live Inbox protocol separates authoritative data, change hints and explicit commands.</text>
<rect x="56" y="166" width="265.5" height="27" rx="5" fill="#E5F2EE"/>
<text x="68" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#176E69" text-anchor="start" letter-spacing="0.5">DOCUMENTED IMPLEMENTATION</text>
<rect x="176" y="225" width="350" height="84" rx="14" fill="#FFFFFF" stroke="#C4D0CD" stroke-width="1.5"/>
<text x="351.0" y="259" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#132F39" text-anchor="middle">Client session</text>
<text x="351.0" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526970" text-anchor="middle">Web / Textual / native Inbox</text>
<rect x="698" y="225" width="310" height="84" rx="14" fill="#FFFFFF" stroke="#C4D0CD" stroke-width="1.5"/>
<text x="853.0" y="259" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#132F39" text-anchor="middle">Coleo API</text>
<text x="853.0" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526970" text-anchor="middle">Auth + query / command authority</text>
<rect x="1156" y="225" width="228" height="84" rx="14" fill="#FFFFFF" stroke="#C4D0CD" stroke-width="1.5"/>
<text x="1270.0" y="259" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#132F39" text-anchor="middle">Source services</text>
<text x="1270.0" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526970" text-anchor="middle">SQLite · Maildir · events</text>
<path d="M 351 310 L 351 1095" fill="none" stroke="#132F39" stroke-width="0.7" stroke-linejoin="round"/>
<path d="M 853 310 L 853 1095" fill="none" stroke="#132F39" stroke-width="0.7" stroke-linejoin="round"/>
<path d="M 1270 310 L 1270 1095" fill="none" stroke="#132F39" stroke-width="0.7" stroke-linejoin="round"/>
<rect x="56" y="339" width="53" height="37" rx="7" fill="#176E69"/>
<text x="82" y="365" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="56" y="407" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#176E69" text-anchor="start">LOAD</text>
<path d="M 351 350 L 853 350" fill="none" stroke="#2D5F9A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="435.4" y="318" width="333.2" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="338" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2D5F9A" text-anchor="middle">Resolve named view + client mappings</text>
<path d="M 351 403 L 853 403" fill="none" stroke="#2D5F9A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="435.4" y="371" width="333.2" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="391" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2D5F9A" text-anchor="middle">GET Inbox: normalized query + cursor</text>
<path d="M 853 403 L 1270 403" fill="none" stroke="#2D5F9A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="955.8" y="371" width="211.39999999999998" height="25" rx="0" fill="#F7F5EF"/>
<text x="1061.5" y="391" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2D5F9A" text-anchor="middle">Read requested sources</text>
<path d="M 1270 463 L 853 463" fill="none" stroke="#176E69" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="947.1" y="431" width="228.79999999999998" height="25" rx="0" fill="#F7F5EF"/>
<text x="1061.5" y="451" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176E69" text-anchor="middle">Rows + source boundaries</text>
<path d="M 853 463 L 351 463" fill="none" stroke="#176E69" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="431.05" y="431" width="341.9" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="451" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176E69" text-anchor="middle">Page + hierarchy + freshness + counts</text>
<text x="372" y="496" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526970" text-anchor="start">Root paging keeps conversation replies attached.</text>
<rect x="56" y="535" width="53" height="37" rx="7" fill="#176E69"/>
<text x="82" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="56" y="603" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#176E69" text-anchor="start">LIVE</text>
<path d="M 853 548 L 351 548" fill="none" stroke="#B04B39" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#coral)"/>
<rect x="435.4" y="516" width="333.2" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="536" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B04B39" text-anchor="middle">Authenticated WebSocket: change hint</text>
<path d="M 351 610 L 853 610" fill="none" stroke="#2D5F9A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="496.3" y="578" width="211.39999999999998" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="598" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2D5F9A" text-anchor="middle">Coalesced HTTP refresh</text>
<rect x="366" y="626" width="820" height="28" rx="0" fill="#F7F5EF"/>
<text x="372" y="645" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526970" text-anchor="start">One read in flight + one pending; reject obsolete generations.</text>
<rect x="56" y="690" width="53" height="37" rx="7" fill="#176E69"/>
<text x="82" y="716" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="56" y="758" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#176E69" text-anchor="start">ACT</text>
<path d="M 351 705 L 853 705" fill="none" stroke="#B04B39" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#coral)"/>
<rect x="418.0" y="673" width="368.0" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="693" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B04B39" text-anchor="middle">POST action: exact IDs + thread revision</text>
<path d="M 853 757 L 1270 757" fill="none" stroke="#B04B39" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#coral)"/>
<rect x="968.85" y="725" width="185.29999999999998" height="25" rx="0" fill="#F7F5EF"/>
<text x="1061.5" y="745" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B04B39" text-anchor="middle">Validate and mutate</text>
<path d="M 853 810 L 351 810" fill="none" stroke="#176E69" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="431.05" y="778" width="341.9" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="798" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176E69" text-anchor="middle">Result → one post-action HTTP refresh</text>
<rect x="366" y="826" width="820" height="56" rx="0" fill="#F7F5EF"/>
<text x="372" y="845" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526970" text-anchor="start">409 stale revision: reload and explicitly reselect; do not auto-retry.</text>
<text x="372" y="874" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526970" text-anchor="start">Folding preserves selection. New replies never enter an old selection.</text>
<rect x="56" y="920" width="53" height="37" rx="7" fill="#176E69"/>
<text x="82" y="946" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text>
<text x="56" y="988" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#176E69" text-anchor="start">RECOVER</text>
<path d="M 351 933 L 853 933" fill="none" stroke="#B04B39" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#coral)"/>
<rect x="409.3" y="901" width="385.4" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="921" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#B04B39" text-anchor="middle">Socket reconnect: authenticate + subscribe</text>
<path d="M 351 995 L 853 995" fill="none" stroke="#2D5F9A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="439.75" y="963" width="324.5" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="983" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2D5F9A" text-anchor="middle">Reload active Inbox query over HTTP</text>
<path d="M 853 1055 L 351 1055" fill="none" stroke="#176E69" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="404.95000000000005" y="1023" width="394.09999999999997" height="25" rx="0" fill="#F7F5EF"/>
<text x="602.0" y="1043" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176E69" text-anchor="middle">Fresh snapshot re-establishes current state</text>
<rect x="56" y="1117" width="636" height="76" rx="14" fill="#F7EFD9" stroke="#C4D0CD" stroke-width="1.5"/>
<text x="78" y="1155" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#132F39" text-anchor="start">Partial source ≠ empty result</text>
<text x="78" y="1174" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526970" text-anchor="start">Retain labeled data; incomplete results do not advance paging.</text>
<rect x="716" y="1117" width="668" height="76" rx="14" fill="#FFFFFF" stroke="#C4D0CD" stroke-width="1.5"/>
<text x="738" y="1155" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#132F39" text-anchor="start">A command result ≠ a successful refresh</text>
<text x="738" y="1174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526970" text-anchor="start">Report partial writes and refresh failures separately; no atomic-store claim.</text>
<path d="M 56 1207 L 1384 1207" fill="none" stroke="#132F39" stroke-width="0.7" stroke-linejoin="round"/>
<text x="56" y="1236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526970" text-anchor="start">One-shot CLI uses the read/action paths and exits without a socket; non-Inbox native/TUI modules use HTTP polling.</text>
<text x="56" y="1260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#526970" text-anchor="start">Sources [S3, S4, S5, S8, S9]  ·  Branch snapshot 8b0c2e4  ·  17 Oct 2026  ·  Source key in the companion guide</text>
</svg>
