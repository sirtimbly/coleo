  <circle cx="19" cy="14" r="1" fill="white"/>
  <circle cx="13.5" cy="14.5" r="0.3" fill="#4f46e5"/>
  <circle cx="19.5" cy="14.5" r="0.3" fill="#4f46e5"/>
  
  <!-- Mouth -->
  <path d="M14 18 C14 19 18 19 18 18" stroke="#4f46e5" stroke-width="1" fill="none"/>
  
  <!-- Tentacles -->
  <path d="M8 16 C4 18 2 20 2 24" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M24 16 C28 18 30 20 30 24" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Tentacle curls -->
  <path d="M2 24 C4 26 6 26 8 24" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M30 24 C28 26 26 26 24 24" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Additional tentacles -->
  <path d="M10 16 C6 14 4 12 4 8" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M22 16 C26 14 28 12 28 8" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Additional tentacle curls -->
