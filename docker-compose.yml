# Coleo Docker Stack
#
# Run the full Coleo environment in Docker:
# - Coleo brain + arms
# - Gitea for git collaboration
# - NATS for distributed arm management
# - SSH access for interactive sessions
#
# Usage:
#   docker compose up -d
#   ssh -p 2222 coleo@localhost  # password: coleo
#   coleo brain run

services:
  # ============================================
  # NATS - Message queue for distributed arms
  # ============================================
  nats:
    image: nats:2.10-alpine
    container_name: coleo-nats
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      # Client connections
      - "4222:4222"
      # Monitoring
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ============================================
  # Coleo - The brain and arms environment
  # ============================================
  coleo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coleo
    hostname: coleo
    environment:
      - COLEO_DIR=/home/coleo/.coleo
      - GITEA_URL=http://gitea:3000
      - COLEO_NATS_URL=nats://nats:4222
      # Pass through API keys from host
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persistent state
      - coleo-data:/home/coleo/.coleo
      # Mount your projects (read-write)
      - ${PROJECTS_DIR:-./projects}:/home/coleo/projects
      # SSH keys for git operations
      - ${SSH_KEYS_DIR:-~/.ssh}:/home/coleo/.ssh:ro
    ports:
      # SSH access
      - "2222:22"
    depends_on:
      nats:
        condition: service_healthy
      gitea:
        condition: service_healthy
    restart: unless-stopped
    # Keep container running for SSH access
    tty: true
    stdin_open: true

  # ============================================
  # Gitea - Local Git forge
  # ============================================
  gitea:
    image: gitea/gitea:latest
    container_name: coleo-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=http://localhost:3000
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=22
      - GITEA__server__SSH_DOMAIN=localhost
      - GITEA__server__SSH_LISTEN_PORT=22
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      # Allow Coleo container to push
      - GITEA__security__INSTALL_LOCK=true
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Web UI
      - "3000:3000"
      # Git SSH (on different port to avoid conflict with coleo SSH)
      - "2223:22"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  coleo-data:
    name: coleo-data
  gitea-data:
    name: coleo-gitea-data

networks:
  default:
    name: coleo-network
