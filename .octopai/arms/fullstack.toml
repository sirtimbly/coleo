# Full-Stack Generalist Arm
# Handles any task across frontend, backend, and infrastructure

[arm]
name = "fullstack-dev"
domain = "general"
harness = "opencode-api"

[model]
# Provider and model for this arm (uses OpenCode format: provider/model_id)
provider = "github-copilot"
model = "claude-opus-4.5"

[context]
budget = 100000
priority_files = [
  "src/**",
  "tests/**"
]

[personality]
traits = "Versatile developer who can work on any part of the codebase"

[convictions]
core = [
  "Clean, readable code over clever code",
  "Tests are essential for confidence",
  "User experience matters at every layer"
]
